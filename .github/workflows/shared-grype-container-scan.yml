---
on:
  workflow_call:
    inputs:
      runtime:
        type: string
        required: true

permissions: {}

jobs:
  grype-scan:
    name: Grype Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Clean Actions Runner
        id: clean_actions_runner
        uses: ministryofjustice/action-clean-runner@390530713a326ddc099b2114f38dd0f2f8eac6da # v1.1.0
        with:
          confirm: true

      - name: Generate .grype.yml Configuration
        id: generate_grype_config
        shell: bash
        env:
          RUNTIME: ${{ inputs.runtime }}
        run: |
          curl --silent --show-error --location \
            "https://raw.githubusercontent.com/ministryofjustice/analytical-platform-airflow-${RUNTIME}-base/main/.grype.yml" \
            --output "analytical-platform-airflow-${RUNTIME}-base-grype.yml" || echo "No base .grype.yml found"

          BASE_GRYPE="analytical-platform-airflow-${RUNTIME}-base-grype.yml"

          if [[ -f "${BASE_GRYPE}" ]] && [[ -f .grype.yml ]]; then
            echo "Merging base and local .grype.yml configurations"
            # shellcheck disable=SC2016
            yq eval-all 'explode(.) as $item ireduce ({}; . *+ $item)' "${BASE_GRYPE}" .grype.yml > merged-grype.yml
            mv merged-grype.yml .grype.yml
          elif [[ -f "${BASE_GRYPE}" ]]; then
            mv "${BASE_GRYPE}" .grype.yml
            echo "Using .grype.yml from base repository"
          elif [[ -f .grype.yml ]]; then
            echo "Using local .grype.yml configuration"
          else
            echo "No .grype.yml found, Grype will use default configuration"
          fi

      - name: Build Container Image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ github.sha }}

      - name: Run Grype Vulnerability Scanner
        id: grype_scan_table
        if: always()
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
          GRYPE_MATCH_PYTHON_USING_CPES: "true"
        run: |
          if ! command -v grype &> /dev/null; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          fi

          echo "=== Running Grype (table, SARIF, and JSON output, High & Critical only) ==="
          grype "${IMAGE_TAG}" \
            --fail-on high \
            --only-fixed=true \
            --output "table=grype-scan-full.txt" \
            --output "sarif=grype-results.sarif" \
            --output "json=grype-results.json" \
            --quiet \
            || GRYPE_EXIT_CODE=$?
          GRYPE_EXIT_CODE=${GRYPE_EXIT_CODE:-0}

          if [[ -s grype-scan-full.txt ]]; then
            awk 'NR==1 || $0 ~ /(High|Critical)[[:space:]]*$/ || $0 ~ /(High|Critical)[[:space:]]/' grype-scan-full.txt > grype-scan-report.txt
            if [[ $(wc -l < grype-scan-report.txt) -le 1 ]]; then
              echo "No High or Critical vulnerabilities found" > grype-scan-report.txt
            fi
          else
            echo "Scan produced no output" > grype-scan-report.txt
          fi

          echo ""
          echo "=== Filtered report ==="
          cat grype-scan-report.txt

          # Generate markdown table with hyperlinked CVE/GHSA IDs from JSON output
          if [[ -f grype-results.json ]]; then
            HIGH_CRIT=$(jq '[.matches[] | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")] | length' grype-results.json)
            if [[ ${HIGH_CRIT} -gt 0 ]]; then
              jq -r '
                def vuln_link:
                  . as $id |
                  if ($id | startswith("CVE-")) then "[" + $id + "](https://nvd.nist.gov/vuln/detail/" + $id + ")"
                  elif ($id | startswith("GHSA-")) then "[" + $id + "](https://github.com/advisories/" + $id + ")"
                  else $id
                  end;
                (
                  ["| Package | Installed | Fixed In | Type | Vulnerability | Severity |",
                   "| :--- | :--- | :--- | :--- | :--- | :--- |"] +
                  [.matches[] |
                    select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical") |
                    "| \(.artifact.name) | \(.artifact.version) | \((.vulnerability.fix.versions // []) | if length == 0 then "No fix available" else join(", ") end) | \(.artifact.type) | \(.vulnerability.id | vuln_link) | \(.vulnerability.severity) |"
                  ]
                ) | .[]
              ' grype-results.json > grype-scan-report-md.txt
            else
              echo "No High or Critical vulnerabilities found." > grype-scan-report-md.txt
            fi
          else
            echo "Scan results unavailable." > grype-scan-report-md.txt
          fi

          {
            echo "scan-report<<EOF"
            cat grype-scan-report.txt
            echo "EOF"
            echo "scan-report-md<<EOF"
            cat grype-scan-report-md.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          if [[ ${GRYPE_EXIT_CODE} -eq 0 ]]; then
            echo "scan-passed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "scan-passed=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Upload Grype SARIF Results
        id: upload_sarif
        if: always()
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        with:
          sarif_file: grype-results.sarif

      - name: Comment on Pull Request
        id: comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_REPORT_MD: ${{ steps.grype_scan_table.outputs.scan-report-md }}
          SCAN_PASSED: ${{ steps.grype_scan_table.outputs.scan-passed }}
        with:
          script: |
            const passed = process.env.SCAN_PASSED === 'true'
            const reportMd = process.env.SCAN_REPORT_MD

            const statusLine = passed
              ? '**Grype Container Scan Passed** No vulnerabilities of severity `high,critical` or higher were found.'
              : '**Grype Container Scan Failed** Vulnerabilities of severity `high,critical` or higher were detected. See the findings below.'

            const body = `## Grype Container Scan\n\n${statusLine}\n\n### Findings (High & Critical)\n\n${reportMd}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Grype Container Scan')
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Scan Summary
        id: scan_summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Grype Container Scan Summary"
            echo ""
            echo "- **Image:** \`${{ github.sha }}\`"
            echo "- **Severity Cutoff:** \`high,critical\`"
            echo "- **Only Fixed Vulnerabilities:** \`true\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f grype-scan-report-md.txt ]] && [[ -s grype-scan-report-md.txt ]]; then
            {
              echo "### Scan Results"
              echo ""
              cat grype-scan-report-md.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Scan Results"
              echo ""
              echo "No scan results available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
